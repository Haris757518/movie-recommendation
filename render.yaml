services:
  - type: web
    name: movie-recommendation-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_AUTO_SYNC_ENABLED
        value: "true"
      - key: TMDB_AUTO_SYNC_INTERVAL_MINUTES
        value: "360"
      - key: TMDB_SYNC_RECENT_PAGES
        value: "3"
      - key: TMDB_SYNC_POPULAR_PAGES
        value: "2"
      - key: TMDB_SYNC_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
